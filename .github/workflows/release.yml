name: Release desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            args: --win --x64
          - platform: macos
            os: macos-latest
            args: --mac --x64 --arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Check release version
        if: github.ref_type == 'tag'
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict')
          assert.equal(process.env.GITHUB_REF_NAME, 'v' + require('./package.json').version,
            'Tag must match package.json version')
          NODE
      - run: npm ci
      - run: npm run lint
      - run: npm run app:dist -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: release
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --verify-tag --generate-notes --prerelease="$PRERELEASE"
